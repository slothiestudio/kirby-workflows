name: Check Kirby site

# Runs on pull requests: installs dependencies, lints, and tests the site.
# Afterwards, Dependabot patch group PRs are merged and deployed to preview.
# With `notify` set, those users get a plain-words comment (and so an email)
# when Dependabot opens a PR, when a patch is auto-merged, and when checks fail.
#
# The caller must grant the permissions the auto-merge job needs:
#   permissions:
#     contents: write
#     pull-requests: write
#     actions: write

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version; match the servers
        required: true
        type: string
      php-lint:
        description: Check PHP syntax in public_html/, site/ (without plugins) and server.php
        required: false
        type: boolean
        default: true
      node-build:
        description: Run `npm run build` (e.g. Vite) after installing npm dependencies
        required: false
        type: boolean
        default: false
      node-version:
        description: Node version
        required: false
        type: string
        default: "24"
      format-check:
        description: Run `npm run format:check` (Prettier, Stylelint, ECS)
        required: false
        type: boolean
        default: true
      smoke-urls:
        description: >
          Paths that must load (HTTP < 400, redirects followed) on PHP's built-in server
          via server.php, one per line. Empty skips the smoke test.
        required: false
        type: string
        default: /panel
      playwright:
        description: Run the Playwright tests (`npm test`) in Chromium and WebKit
        required: false
        type: boolean
        default: false
      notify:
        description: >
          GitHub usernames (space-separated, without @) to mention after a Dependabot
          auto-merge. GitHub then emails them through their notification settings.
        required: false
        type: string
        default: ""
      preview-url:
        description: Preview site URL, linked in the auto-merge email
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Install and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get latest code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: gd, ctype, curl, mbstring, zip
          tools: composer:v2

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint PHP
        if: inputs.php-lint
        run: |
          paths=""
          for p in public_html site server.php; do [ -e "$p" ] && paths="$paths $p"; done
          # shellcheck disable=SC2086
          find $paths -name '*.php' -not -path 'site/plugins/*' -print0 | xargs -0 -n1 php -l

      - name: Set up Node
        if: inputs.node-build || inputs.format-check || inputs.playwright
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install npm dependencies
        if: inputs.node-build || inputs.format-check || inputs.playwright
        run: npm ci

      - name: Build frontend
        if: inputs.node-build
        run: npm run build

      - name: Check formatting and lint
        if: inputs.format-check
        run: npm run format:check

      - name: Smoke test
        if: inputs.smoke-urls != ''
        env:
          SMOKE_URLS: ${{ inputs.smoke-urls }}
        run: |
          php -S localhost:8888 -t public_html server.php > server.log 2>&1 &
          sleep 2
          failed=0
          while IFS= read -r path; do
            path="$(echo "$path" | xargs)"
            [ -z "$path" ] && continue
            if curl -fsSL -o /dev/null "localhost:8888$path"; then
              echo "ok   $path"
            else
              echo "::error::$path did not load"
              failed=1
            fi
          done <<< "$SMOKE_URLS"
          exit $failed

      - name: Show server log
        if: failure() && inputs.smoke-urls != ''
        run: cat server.log || true

      # Loads every page in a real browser and fails on JS errors, failed requests,
      # broken images or broken interactions. See the site's tests/ folder.
      - name: Install Playwright browsers
        if: inputs.playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright tests
        if: inputs.playwright
        run: npm test

      - name: Upload test report
        if: failure() && inputs.playwright
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Merge Dependabot patch group PRs once the check above passes, then
  # deploy to preview. Minors, majors, security PRs and GitHub Actions updates are
  # left for manual review. `live` is never touched.
  automerge:
    name: Auto-merge Dependabot patches
    needs: check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.title, '-patch group')
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Merge PR
        run: gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"

      # Merges made with the workflow token don't fire push events,
      # so start the preview deploy and the release PR update directly.
      - name: Deploy to preview
        run: gh workflow run preview.yml --ref main

      - name: Update release PR
        run: gh workflow run release-pr.yml --ref main

      # A comment that @mentions people makes GitHub email them.
      - name: Notify
        if: inputs.notify != ''
        env:
          NOTIFY: ${{ inputs.notify }}
          TITLE: ${{ github.event.pull_request.title }}
          PREVIEW_URL: ${{ inputs.preview-url }}
        run: |
          mentions=$(printf '%s' "$NOTIFY" | tr -s ' ' '\n' | sed '/^$/d; s/^@*/@/' | tr '\n' ' ')
          # "chore(deps): bump x from 1.0.0 to 1.0.1 in the y group" -> "x from 1.0.0 to 1.0.1"
          what=$(printf '%s' "$TITLE" | sed -E 's/^[a-z]+(\([^)]*\))?: //; s/^[Bb]ump //; s/ in the [^ ]+ group$//')
          if [ -n "$PREVIEW_URL" ]; then
            preview="Preview: $PREVIEW_URL (updated in a few minutes)"
          else
            preview="Preview: being deployed now"
          fi
          release=$(gh pr list --base live --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$release" ]; then
            live="Live: not changed. It goes live when you merge the release PR #$release."
          else
            live="Live: not changed. It goes live with the next main → live release PR."
          fi
          gh pr comment "$PR" --body-file - <<BODY
          $mentions

          **Updated automatically: $what**

          Dependabot found a small bug-fix (patch) update. The checks passed, so it was merged into main.

          - $preview
          - $live

          Nothing to do, unless something looks wrong on preview.
          BODY

  # When Dependabot opens a PR, say in plain words what it is and whether
  # anyone needs to act. The @mentions make GitHub email the notify users.
  announce:
    name: Announce Dependabot PR
    runs-on: ubuntu-latest
    if: >-
      inputs.notify != '' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      NOTIFY: ${{ inputs.notify }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Comment
        run: |
          mentions=$(printf '%s' "$NOTIFY" | tr -s ' ' '\n' | sed '/^$/d; s/^@*/@/' | tr '\n' ' ')
          what=$(printf '%s' "$TITLE" | sed -E 's/^[a-z]+(\([^)]*\))?: //; s/^[Bb]ump //; s/ in the [^ ]+ group$//')

          # Patch, minor or major: from the group name, else from the versions
          kind=""
          case "$TITLE" in
            *-patch\ group*) kind="patch" ;;
            *-minor\ group*) kind="minor" ;;
          esac
          if [ -z "$kind" ]; then
            from=$(printf '%s' "$TITLE" | sed -nE 's/.* from v?([0-9][^ ]*) to v?([0-9][^ ]*).*/\1/p')
            to=$(printf '%s' "$TITLE" | sed -nE 's/.* from v?([0-9][^ ]*) to v?([0-9][^ ]*).*/\2/p')
            if [ -n "$from" ]; then
              if [ "${from%%.*}" != "${to%%.*}" ]; then kind="major"
              elif [ "$(echo "$from" | cut -d. -f2)" != "$(echo "$to" | cut -d. -f2)" ]; then kind="minor"
              else kind="patch"; fi
            fi
          fi

          if [ "$BASE" = main ] && printf '%s' "$TITLE" | grep -q -- '-patch group'; then
            body="$mentions

          **Bug-fix update: $what**

          This will be merged automatically once the checks pass. You'll get a second email when it's on preview.

          Nothing to do."
          else
            case "$kind" in
              major) label="major: may need changes to the site" ;;
              minor) label="minor: new features, should be compatible" ;;
              patch) label="bug fix" ;;
              *) label="update" ;;
            esac
            case "$HEAD_REF" in
              dependabot/github_actions/*) label="GitHub Actions: only affects the automated checks and deploys, not the site" ;;
            esac
            body="$mentions

          **Needs your review: $what** ($label)

          This one isn't merged automatically. Look at the release notes below in this PR, then merge it if it's fine. Merging deploys it to preview; it reaches live only through the main → live release PR."
          fi
          printf '%s\n' "$body" | gh pr comment "$PR" --body-file -

  # A Dependabot PR whose checks failed is left open: say so, or nobody notices.
  failed:
    name: Report failed Dependabot PR
    needs: check
    runs-on: ubuntu-latest
    if: >-
      failure() &&
      inputs.notify != '' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      NOTIFY: ${{ inputs.notify }}
      TITLE: ${{ github.event.pull_request.title }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment
        run: |
          mentions=$(printf '%s' "$NOTIFY" | tr -s ' ' '\n' | sed '/^$/d; s/^@*/@/' | tr '\n' ' ')
          what=$(printf '%s' "$TITLE" | sed -E 's/^[a-z]+(\([^)]*\))?: //; s/^[Bb]ump //; s/ in the [^ ]+ group$//')
          gh pr comment "$PR" --body-file - <<BODY
          $mentions

          **Update failed its checks: $what**

          It wasn't merged, and the site is unchanged. See what broke: $RUN_URL

          Fix it on this PR, or close it to skip this update.
          BODY
